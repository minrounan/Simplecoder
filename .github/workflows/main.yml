name: Auto API Call

on:
  schedule:
    - cron: '*/5 * * * *'

  workflow_dispatch:

jobs:
  call-api:
    runs-on: ubuntu-latest

    steps:
      - name: Call Holmes API
        run: |
          curl -k https://coder.holmesai.xyz/v1/messages \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer ${{ secrets.API_KEY }}" \
          -d '{
          "model":"claude-sonnet-4-6",
          "messages":[
          {
          "role":"user",
          "content":"24/7 GitHub run"
          }]
          }'
